<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Programa Situação do Aluno</h1>
    <form action="">
        <p>Nome do Aluno: <input type="text" id="inNome" required></p>
        <p>1 Nota: <input type="number" id="inNota1" step="0.1" min="0.1" max="10" required></p>
        <p>2 Nota: <input type="number" id="inNota2" step="0.1" min="0.1" max="10" required></p>
        <input type="submit" value="Calcular">
    </form>
    <h3></h3>
    <h4></h4>
    <script>
        const form = document.querySelector("form")
        const out1 = document.querySelector("h3")
        const out2 = document.querySelector("h4")

        form.addEventListener("submit", (e) => {
            e.preventDefault()
            const nome = form.inNome.value
            const nota1 = Number(form.inNota1.value)
            const nota2 = Number(form.inNota2.value)
            const media = (nota1 + nota2)/2
            out1.innerText = `Média das notas é ${media.toFixed(2)}.`
            if (media>=7) {
                out2.innerText = `Parabéns, ${nome}! Voce foi aprovado!`
                out2.style.color = "blue"
            } else {
                out2.innerText = `Ops ${nome}... Voce não obteve nota suficiente.`
                out2.style.color = "red"
            }
        })
    </script>
</body>
</html>
