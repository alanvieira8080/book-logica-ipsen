<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="js/livrojs.png">
    <title>Document</title>
    <style>
        img {
            float: left;
            height: 300px;
            width: 300px;
        }
        h1 {
            border-bottom-style: inset;
        }
    </style>
</head>
<body>
    <img src="img/ex4_2.jpg" alt="Balança de Pesos">
    <h1>Programa Cálculo do Peso Ideal</h1>
    <form action="">
        <p>Nome: <input type="text" id="inNome" required></p>
        <p>Sexo:
            <input type="radio" name="sexo" id="inMasculino" required>Masculino
            <input type="radio" name="sexo" id="idFeminino" required>Feminino
        </p>
        <p>Altura: <input type="number" min="0" step="0.01" id="inAltura" required></p>
        <input type="submit" value="Calcular Peso Ideal">
        <input type="reset" value="Limpar Campos">
    </form>
    <h3></h3>
    <script>
        const form = document.querySelector("form")
        const resp = document.querySelector("h3")

        form.addEventListener("submit", (e) => {
            e.preventDefault()
            
            const nome = form.inNome.value
            const masculino = form.inMasculino.checked
            const altura = Number(form.inAltura.value)

            const peso = masculino ? 22 * Math.pow(altura, 2) : 21 * Math.pow(altura, 2)

            resp.innerText = `${nome}: Seu peso ideal é ${peso.toFixed(3)} kg.`
        })

        form.addEventListener("reset", (e) => {
            resp.innerText = ""
        })
    </script>
</body>
</html>
