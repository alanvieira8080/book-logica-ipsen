<script>
    const bairro = prompt("Bairro de Entrega: ")
    let taxaDeEntrega
    switch (bairro) {
        case "":
            taxaDeEntrega = 5.00
            break
        case "Fragata":
        case "Três Vendas":
            taxaDeEntrega = 7.00
            break
        case "Laranjal":
            taxaDeEntrega = 10.00
            break
        default:
            taxaDeEntrega = 8.00
    }
    alert(`Taxa R$ ${taxaDeEntrega.toFixed(2)}`)
</script>
