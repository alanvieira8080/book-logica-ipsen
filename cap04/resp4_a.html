<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="js/livrojs.png">
    <title>Document</title>
    <style>
        img {
            float: left;
            height: 300px;
            width: 300px;
        }
        h1 {
            border-bottom-style: inset;
        }
    </style>
</head>
<body>
    <img src="img/exerc.jpg" alt="Imagem de Exercício">
    <h1>Programa Par ou Impar</h1>
    <form>
      <p>Número: <input type="text" id="inNumero"></p>
      <input type="submit" value="Verificar">
    </form>
    <h3></h3>
    <script>
      const form = document.querySelector("form")
      const resp = document.querySelector("h3")

      form.addEventListener("submit", (e) => {
        e.preventDefault()
        const numero = Number(form.inNumero.value)
        // if (numero % 2 == 0) {
        //   resp.innerText = `${numero} é par!`
        // } else { 
        //   resp.innerText = `${numero} é ímpar!`
        // }
        const resposta = numero % 2 == 0 ? "par" : "ímpar"
        resp.innerText = `${numero} é ${resposta}.`
      })
    </script>
</body>
</html>
