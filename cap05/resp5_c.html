<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="js/favicon.png" />
    <title>Document</title>
    <style>
      img.normal {
        float: left;
        height: 300px;
        width: 300px;
      }
      img.alta {
        float: left;
        height: 420px;
        width: 300px;
      }
      h1 {
        border-bottom-style: inset;
      }
      pre {
        font-size: 1.2em;
      }
    </style>
  </head>
  <body>
    <img src="img/image.jpg" alt="Imagem de Ilustração" class="normal" />
    <h1>Programa Números Perfeitos</h1>
    <form action="">
      <p>Número: <input type="number" id="inNumero" min="2" required /></p>
      <input type="submit" value="Executar" />
    </form>
    <h3 id="out1"></h3>
    <h3 id="out2"></h3>    
    <script>
      const form = document.querySelector("form");
      const out1 = document.querySelector("#out1");
      const out2 = document.querySelector("#out2");
      
      form.addEventListener("submit", (e) => {
        e.preventDefault()

        const numero = Number(form.inNumero.value)

        let resposta = `Divisores de ${numero}: 1`
        let somaDivisores = 1
        for(let i = 2; i <= numero / 2; i++) {
            if (numero % i == 0) {
                somaDivisores += i
                resposta += `, ${i}`
            }
        }

        resposta += ` (Soma: ${somaDivisores}).`
        
        out1.innerText = resposta
        if (somaDivisores == numero) {
            out2.innerText = `${numero} é um número perfeito.`
        } else {
            out2.innerText = `${numero} não é um número perfeito.`
        }
      });
    </script>
  </body>
</html>
