<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/favicon-book.png" type="image/x-icon">
    <title>Document</title>
    <style>
        img {
            float: left;
            height: 300px;
            width: 300px;
        }
        h1 {
            border-bottom-style: inset;
        }
        .entre-letras {
            letter-spacing: 0.5em;
        }
        .alinha-direita {
            text-align: right;
        }
    </style>
</head>
<body>
    <img src="../assets/img-exercise.jpg" alt="Ilustração de Atividade">
    <h1>Multa de Trânsito</h1>
    <form action="">
        <p>Data da Infração: <input type="date" id="inDate" required autofocus></p>
        <p>Valor da Multa (R$): <input type="number" id="inFine" min="0.00" step="0.01" required></p>
        <input type="submit" value="Calcular">
        <p>Data Limite do Desconto: <input type="text" id="outDate" value="1990-01-01" readonly></p>
        <p>Valor da Multa com Desconto (R$): <input type="number" id="outFine" min="0.00" step="0.01" value="0.00" readonly></p>
    </form>
    <script>
        const form = document.querySelector("form")
        
        form.addEventListener("submit", (e) => {
            e.preventDefault()

            const dateFine = form.inDate.value
            const datePart = dateFine.split("-")
            let paymentDate = new Date()
            paymentDate.setDate(Number(datePart[2]))
            paymentDate.setMonth(Number(datePart[1] - 1))
            paymentDate.setFullYear(Number(datePart[0]))
            paymentDate.setDate(paymentDate.getDate() + 90)
            form.outDate.value = `${paymentDate.getDate()}/${paymentDate.getMonth() + 1}/${paymentDate.getFullYear()}`

            const valueFine = Number(form.inFine.value)
            const paymentValue = valueFine * 0.80
            form.outFine.value = paymentValue.toFixed(2)
        })
    </script>
</body>
</html>
