<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Cine JS: Filmes em Cartaz</h1>
    <form>
        <p>Título: <input type="text" id="valueTitulo"></p>
        <p>Duração(min) <input type="number" id="valueDuracao"></p>
        <input type="submit" value="Converter em HH:MM">
        <p id="resultadoFormulario"></p>
    </form>
    <h3></h3>
    <script>
        const frm = document.querySelector("form")
        const resp = document.querySelector("h3")

        frm.addEventListener("submit", (e) => {
            const titulo = frm.valueTitulo.value
            const duracao = frm.valueDuracao.value

            const horas = Math.floor(duracao / 60)
            const minutos = duracao % 60

            console.log(titulo)
            console.log(duracao)

            resp.innerHTML = `${titulo}</br></br>${horas} hora(s) e ${minutos} minuto(s).`

            e.preventDefault()
        })
    </script>
</body>

</html>
