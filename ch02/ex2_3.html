<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Revenda de Veículo</h1>
    <form>
        <p>Veículo:<input type="text" id="inVeiculo" required></p>
        <p>Preço R$:<input type="number" id="inPreco" required></p>
        <input type="submit" value="Ver Promoção">
    </form>
    <h2></h2>
    <h3></h3>
    <h4></h4>
    <script>
        const frm = document.querySelector("form")
        const resp1 = document.querySelector("h2")
        const resp2 = document.querySelector("h3")
        const resp3 = document.querySelector("h4")

        frm.addEventListener("submit", (e) => {
            const veiculo = frm.inVeiculo.value
            const preco = frm.inPreco.value

            const entrada = preco * 0.5
            const parcela = preco * 0.5 / 12

            resp1.innerText = `Promoção: ${veiculo}`
            resp2.innerText = `Entrada de R$ ${entrada}`
            resp3.innerText = `+ 12 x de R$ ${parcela}`

            e.preventDefault()
        })
    </script>
</body>

</html>
