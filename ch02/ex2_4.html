<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Restaurante JS</h1>
    <form>
        <p>Preço do Buffet por Quilo <input type="number" id="inPreco" min="1" step="0.01" required></p>
        <p>Consumo do Cliente (grama) <input type="number" id="inConsumo" min="1" required></p>
        <input type="submit" value="Calcular">
    </form>
    <h3></h3>
    <script>
        const frm = document.querySelector('form')
        const resp = document.querySelector('h3')

        frm.addEventListener('submit', (e) => {
            const valuePreco = Number(frm.inPreco.value)
            const valueConsumo = Number(frm.inConsumo.value)

            const valorTotal = valuePreco / 1000 * valueConsumo

            resp.innerText = `Valor a Pagar é R$ ${valorTotal.toFixed(2)}`
        })
    </script>
</body>

</html>
