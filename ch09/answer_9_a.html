<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="shortcut icon" href="../favicon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        pre {
            font-size: 1.2em;
        }
        .cores-brasil {
            color: black;
            background-color: red;
        }
        .cores-pelotas {
            color: blue;
            background-color: yellow;
        }
        .cores-farroupilha {
            color: green;
            background-color: white;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row" id="main">
            <div class="col-sm-7">
                <h1>Loja de Esportes Avenida</h1>
                <h2>Produtos Esportivos no Geral</h2>
                <p id="visit"></p>
            </div>
            <div class="col-sm-3">
                <h5>Qual seu time de paixão?</h5>
                <form>
                    <p><input type="radio" name="club" id="rbtnBrasil">&ensp;Brasil</p>
                    <p><input type="radio" name="club" id="rbtnPelotas">&ensp;Pelotas</p>
                    <p><input type="radio" name="club" id="rbtnFarroupilha">&ensp;Farroupilha</p>
                </form>
            </div>
            <div class="col-sm-2">
                <img class="d-none" id="img-club">
            </div>
        </div>
    </div>
    <script>
        const checkClub = () => {
            const club = localStorage.getItem("club")
            if (!club) return

            if (club == "Brasil") form.rbtnBrasil.checked = true
            if (club == "Pelotas") form.rbtnPelotas.checked = true
            if (club == "Farroupilha") form.rbtnFarroupilha.checked = true
            
            changeClub()
        }

        const changeClub = () => {
            let club = ""
            if (form.rbtnBrasil.checked) club = "Brasil"
            if (form.rbtnPelotas.checked) club = "Pelotas"
            if (form.rbtnFarroupilha.checked) club = "Farroupilha"

            localStorage.setItem("club", club)

            main.className = `row cores-${club.toLowerCase()}`

            image_club.className = "img-fluid"
            image_club.src = `../exercise.jpg`
            image_club.alt = "Imagem do Time"
        }

        const countVisit = () => {
            if (localStorage.getItem("visit")) {
                localStorage.setItem("visit", Number(localStorage.getItem("visit")) + 1) 
            } else {
                localStorage.setItem("visit", 1)
            }
        }

        const updateWelcome = () => {
            const count = Number(localStorage.getItem("visit"))

            visit.innerText = count == 1 ? "Muito bem-vindo! Esta é a sua primeira visita." : `Que bom que voltou! Está é sua visita de número ${count}.`
        }
        
        const form = document.querySelector("form")
        const rbtn = document.querySelectorAll("input")
        const main = document.querySelector("#main")
        const image_club = document.querySelector("#img-club")
        const visit = document.querySelector("#visit")

        window.addEventListener("load", checkClub)
        window.addEventListener("load", countVisit)
        window.addEventListener("load", updateWelcome)
        for (radio of rbtn) radio.addEventListener("change", changeClub)
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
