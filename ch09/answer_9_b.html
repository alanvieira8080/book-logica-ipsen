<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="shortcut icon" href="../favicon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        pre {
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-4">
                <img src="../exercise.jpg" alt="Ilustração de Exercício" class="img-fluid">
            </div>
            <div class="col-sm-8">
                <h1>Compras da Semana</h1>
                <form>
                    <div class="mb-3">
                        <label for="inProduct">Produto:</label>
                        <input type="text" id="inProduct" class="form-control" required autofocus>
                    </div>
                    <input type="submit" value="Adicionar" class="btn btn-primary">
                    <input type="button" value="Limpar" id="btnClear" class="btn btn-danger">
                </form>
                <pre></pre>
            </div>
        </div>
    </div>
    <script>
        const form = document.querySelector("form")
        const output = document.querySelector("pre")

        const addProduct = (product, products) => {
            if (!products.includes(product)) products.push(product)

            products.sort()

            return products
        }

        const formatProducts = (products) => {
            return `Produtos Adicionados\n${"-".repeat(40)}\n${products.join("\n")}`
        }

        const getProducts = () => {
            const data = localStorage.getItem("products")
            return data ? data.split(";") : []
        }

        const resetForm = () => {
            form.inProduct.value = ""
            form.inProduct.focus()
        }

        const render = (products) => {
            output.innerText = products.length ? formatProducts(products) : ""
        }

        window.addEventListener("load", (e) => {
            render(getProducts())
        })

        form.addEventListener("submit", (e) => {
            e.preventDefault()

            const product = form.inProduct.value
            if (!product.trim()) return

            const products = addProduct(product, getProducts())

            localStorage.setItem("products", products.join(";"))
            render(products)
            resetForm()
        })

        form.btnClear.addEventListener("click", (e) => {
            localStorage.setItem("products", "")
            render([])
            resetForm()
        })
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
