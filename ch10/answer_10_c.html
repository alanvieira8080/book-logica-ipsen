<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="shortcut icon" href="../favicon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        h1 {
            border-bottom-style: inset;
        }
        .tarefa-selecionada {
            color: red;
            font-style: italic;
        }
        .tarefa-normal {
            color: black;
        }
        img.moeda1-00 {
            height: 84px;
            width: 84px;
            margin-bottom: 5px;
        }
        img.moeda0-50 {
            height: 66px;
            width: 66px;
            margin-bottom: 5px;
        }
        img.moeda0-25 {
            height: 76px;
            width: 76px;
            margin-bottom: 5px;
        }
        img.moeda0-10 {
            height: 60px;
            width: 60px;
            margin-bottom: 5px;
        }
        .exclui {
            color: red;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-4">
                <img src="../exercise.jpg" alt="Exercício" class="img-fluid">
            </div>
            <div class="col-sm-8" id="body">
                <h1>Copa do Brasil — Classificados</h1>
                <form>
                    <label for="inClub">Clube:</label>
                    <input type="text" class="form-control" id="inClub" required autofocus>
                    <div class="mt-3 mb-3">
                        <input type="submit" class="btn btn-primary" id="btnSubmit" value="Adicionar Clube">
                        <input type="button" class="btn btn-secondary" id="btnTable" value="Montar Tabela">
                        <input type="reset" class="btn btn-danger" value="Novos Clubes">
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        const form = document.querySelector("form")
        const body = document.querySelector("#body")

        form.addEventListener("submit", (e) => {
            e.preventDefault()

            const club = form.inClub.value

            const h5 = document.createElement("h5")
            const text = document.createTextNode(club)
            h5.appendChild(text)
            h5.style.textAlign = "right"
            h5.style.fontStyle = "italic"

            body.appendChild(h5)

            form.inClub.value = ""
            form.inClub.focus()
        })

        form.btnTable.addEventListener("click", (e) => {
            const teams = document.querySelectorAll("h5")

            if (teams.length % 2 != 0 || !teams) {
                alert("O número de times não pode ser vazio ou ímpar!")
                form.inClub.focus()
                return
            }

            const text = document.createTextNode("Tabela de Jogos")
            const th = document.createElement("th")
            const table = document.createElement("table")
            th.appendChild(text)
            table.style.width = "100%"
            table.appendChild(th)
            body.appendChild(table)

            let alternate = true
            for (let index = 0; index < teams.length - 1; index += 2) {
                const line = table.insertRow(-1)
                if (alternate) {
                    line.style.backgroundColor = "lightgray"
                    alternate = false
                } else {
                    alternate = true
                }
                const player1 = line.insertCell(-1)
                player1.style.width = "50%"
                player1.style.height = "30px"
                player1.innerText = teams[index].innerText
                const player2 = line.insertCell(-1)
                player2.style.width = "50%"
                player2.style.height = "30px"
                player2.innerText = teams[index + 1].innerText
            }

            form.btnTable.disabled = true
            form.btnSubmit.disabled = true
        })

        form.addEventListener("reset", () => {
            window.location.reload()
        })

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
